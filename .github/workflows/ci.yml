name: GharPlate CI — Lint, Test & Build Validation

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend-ci:
    name: Backend Lint, Seed & Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system OCR & backend dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Run Python syntax and lint check
        run: |
          python -m compileall app tests
          ruff check app tests

      - name: Run reproducible data ingestion script
        working-directory: .
        run: |
          PYTHONPATH=backend python scripts/seed_data.py

      - name: Execute Backend Unit, Integration & E2E Pytest Suites
        run: |
          PYTHONPATH=. pytest -v tests/

  frontend-ci:
    name: Frontend Typecheck, Vitest & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Execute Frontend Vitest Suite
        run: npm run test

      - name: Build Production Frontend Bundle
        run: npm run build

  docker-build-validation:
    name: Validate Docker Images Build
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -f backend/Dockerfile -t gharplate-backend:ci .

      - name: Build Frontend Docker Image
        run: docker build -f frontend/Dockerfile -t gharplate-frontend:ci .
