name: GharPlate CI/CD & Docker Hub Pipeline

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: mrfaisu0243

jobs:
  # ============================================================================
  # STAGE 1 — Backend Static Analysis, Seed Validation & Automated Test Suite
  # ============================================================================
  backend-ci:
    name: "Stage 1: Backend Lint, Seed & Pytest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system OCR & imaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libgl1 libglib2.0-0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install pinned Python dependencies (including Ruff)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pinned Ruff linter
        working-directory: backend
        run: |
          ruff --version
          ruff check app tests

      - name: Verify Python bytecode compilation
        working-directory: backend
        run: python -m compileall -q app tests

      - name: Validate isolated database schema creation & data seed integrity
        env:
          DATABASE_URL: "sqlite:////tmp/gharplate_ci_seed.db"
        run: |
          python scripts/seed_data.py
          rm -f /tmp/gharplate_ci_seed.db

      - name: Run Backend Pytest Suite (44 tests) with JUnit XML report
        working-directory: backend
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite:////tmp/gharplate_ci_pytest.db"
          ENABLE_EXTERNAL_BARCODE_LOOKUP: "true"
          ENABLE_USDA_FDC_LOOKUP: "true"
          ENABLE_LOCAL_AI_ASSISTANT: "true"
        run: |
          pytest -v --junitxml=/tmp/backend-junit.xml tests/

      - name: Upload Backend JUnit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: /tmp/backend-junit.xml

  # ============================================================================
  # STAGE 2 — Frontend TypeScript Lint, Vitest Unit Tests & Production Build
  # ============================================================================
  frontend-ci:
    name: "Stage 2: Frontend Lint, Vitest & Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies cleanly (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript typecheck (npm run lint)
        working-directory: frontend
        run: npm run lint

      - name: Run Frontend Vitest unit tests (npm test)
        working-directory: frontend
        run: npm test

      - name: Build production frontend bundle (npm run build)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: "http://localhost:8000/api/v1"
        run: |
          npm run build
          test -f dist/index.html

  # ============================================================================
  # STAGE 3 — Docker Image Build Validation
  # ============================================================================
  docker-build-validation:
    name: "Stage 3: Docker Image Build Validation"
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: gharplate-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: gharplate-frontend:ci-test
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STAGE 4 — Docker Compose Full-Stack Smoke Test
  # ============================================================================
  docker-compose-smoke-test:
    name: "Stage 4: Docker Compose Smoke Test"
    runs-on: ubuntu-latest
    needs: [docker-build-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI environment file from .env.example
        run: cp .env.example .env

      - name: Start isolated Docker Compose stack
        run: docker compose -p gharplate_ci up --build -d

      - name: Wait for Backend & Frontend readiness and run API smoke tests
        run: |
          echo "Waiting for GharPlate Backend API at http://localhost:8000/api/v1/health ..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health > /tmp/health.json; then
              echo "Backend is healthy!"
              cat /tmp/health.json
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend failed to become healthy within timeout."
              exit 1
            fi
            sleep 2
          done

          python3 -c '
          import json
          with open("/tmp/health.json") as f:
              data = json.load(f)
          assert data["status"] == "healthy", f"Unexpected health status: {data}"
          assert data["counts"]["foods"] >= 50, f"Expected >=50 foods, got {data}"
          assert data["counts"]["conditions"] >= 18, f"Expected >=18 conditions, got {data}"
          '

          # The food catalog APIs are protected after real authentication was added.
          # In this unauthenticated smoke-test step, verify that private endpoints
          # reject anonymous requests instead of expecting HTTP 200.
          assert_unauthenticated_401() {
            local path="$1"
            local label="$2"
            local body_file="$3"
            local status

            status=$(curl -sS -o "$body_file" -w "%{http_code}" "http://localhost:8000${path}")

            if [ "$status" != "401" ]; then
              echo "FAIL: ${label} should reject unauthenticated requests with HTTP 401; got HTTP ${status}."
              cat "$body_file"
              return 1
            fi

            echo "PASS: ${label} correctly rejected an unauthenticated request (HTTP 401)."
          }

          echo "Verifying protected /api/v1/foods/categories endpoint..."
          assert_unauthenticated_401 "/api/v1/foods/categories" "Food categories endpoint" "/tmp/categories.json"

          echo "Verifying protected /api/v1/foods search endpoint..."
          assert_unauthenticated_401 "/api/v1/foods?q=Ragi" "Food search endpoint" "/tmp/foods.json"

          echo "Waiting for GharPlate Frontend Nginx Server at http://localhost:8080/ ..."
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/ > /tmp/index.html; then
              grep -q "GharPlate" /tmp/index.html
              echo "Frontend is serving GharPlate SPA!"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Frontend failed to respond at http://localhost:8080/"
              exit 1
            fi
            sleep 2
          done

      - name: Print container diagnostics on failure
        if: failure()
        run: |
          docker compose -p gharplate_ci ps
          docker compose -p gharplate_ci logs --no-color

      - name: Tear down isolated Docker Compose stack
        if: always()
        run: docker compose -p gharplate_ci down -v --remove-orphans

  # ============================================================================
  # STAGE 5 — Gated Multi-Arch Docker Hub Publish (main & v*.*.* tags only)
  # ============================================================================
  publish-dockerhub:
    name: "Stage 5: Publish Images to Docker Hub"
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
      - docker-build-validation
      - docker-compose-smoke-test
    if: >
      success() &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push GharPlate Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push GharPlate Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000/api/v1
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write Docker Hub Publish Summary
        run: |
          {
            echo "### 🚀 Docker Hub Images Published"
            echo ""
            echo "| Service | Published Tags | Platforms |"
            echo "|---|---|---|"
            echo "| **Backend API** | \`${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-backend:latest\`<br>\`${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-backend:${{ github.sha }}\` | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| **Frontend SPA** | \`${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-frontend:latest\`<br>\`${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-frontend:${{ github.sha }}\` | \`linux/amd64\`, \`linux/arm64\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # STAGE 6 — Pipeline Execution Summary
  # ============================================================================
  pipeline-summary:
    name: "Pipeline Verification Summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-ci
      - frontend-ci
      - docker-build-validation
      - docker-compose-smoke-test
    steps:
      - name: Generate GitHub Actions Step Summary
        run: |
          {
            echo "## 🍽️ GharPlate CI/CD Pipeline Report"
            echo ""
            echo "| Stage | Check | Status |"
            echo "|---|---|---|"
            echo "| **Stage 1** | Backend Ruff Lint, Seed Validation & Pytest (`backend-ci`) | **${{ needs.backend-ci.result }}** |"
            echo "| **Stage 2** | Frontend TypeScript, Vitest & Vite Build (`frontend-ci`) | **${{ needs.frontend-ci.result }}** |"
            echo "| **Stage 3** | Docker Image Build Validation (`docker-build-validation`) | **${{ needs.docker-build-validation.result }}** |"
            echo "| **Stage 4** | Docker Compose Full-Stack Smoke Test (`docker-compose-smoke-test`) | **${{ needs.docker-compose-smoke-test.result }}** |"
            echo ""
            echo "- **Commit SHA:** \`${{ github.sha }}\`"
            echo "- **Branch / Ref:** \`${{ github.ref_name }}\`"
            echo "- **Event:** \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
