name: Manual / Reusable Docker Hub Release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional custom image tag (in addition to latest and commit SHA)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: mrfaisu0243

jobs:
  validate-before-publish:
    name: "Validate Backend & Frontend Before Manual Publish"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libgl1 libglib2.0-0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Run Backend Ruff & Pytest
        working-directory: backend
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite:////tmp/gharplate_release_test.db"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ruff --version
          ruff check app tests
          pytest -v tests/

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Run Frontend Lint, Vitest & Build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  publish:
    name: "Build & Push Multi-Arch Images to Docker Hub"
    runs-on: ubuntu-latest
    needs: [validate-before-publish]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push GharPlate Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push GharPlate Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000/api/v1
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_NAMESPACE }}/gharplate-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
