[project]
name = "gharplate-backend"
version = "2.0.0"
description = "GharPlate Indian Household Food Intelligence and Personalised Nutrition Platform Backend API"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
